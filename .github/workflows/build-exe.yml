# Builds the Windows exe with game/dist.py on every push, so a current
# build is always available without running PyInstaller locally.
#
#   - Every branch: the zip is attached to the workflow run (Actions tab ->
#     the run -> Artifacts). Kept 30 days.
#   - main: also published as the "latest-build" pre-release, a fixed
#     download link that always holds the newest main build:
#     https://github.com/<owner>/<repo>/releases/tag/latest-build
name: Build exe

on:
  push:
    paths-ignore:
      - "**.md"
      - "firmware/**"
      - "ICS_Attacks/**"
      - "archive/**"
      - "graphify-out/**"
  workflow_dispatch:

# A newer push to the same branch makes an older, unfinished build pointless
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to update the latest-build release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: game
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # matches pyproject.toml
          cache: pip
          cache-dependency-path: game/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: python dist.py

      - name: Zip
        run: |
          name=$(python -c "import dist; print(dist.build_name())")
          python -c "import shutil; shutil.make_archive('$name', 'zip', 'dist')"
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.BUILD_NAME }}
          path: game/dist/ # uploaded as a zip of the exe + assets/
          retention-days: 30

      - name: Publish latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build "$BUILD_NAME.zip" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of main at $GITHUB_SHA. Unzip and run $BUILD_NAME.exe as Administrator; keep assets/ next to it."
